name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Code Formatting
        run: nix-shell --run "zig fmt --check build.zig build.zig.zon src"

      - name: Build Upeo
        run: nix-shell --run "zig build --summary all"
